<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head><title>로그인</title></head>
<body>
<main>
    <div class="row justify-content-center auth-wrapper">
        <div class="col-md-5 col-lg-4">
            <div class="card auth-card">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <h1 class="h4 mb-1">로그인</h1>
                        <p class="text-muted small mb-0">SubmitHub 계정으로 과제 및 코드 리뷰에 접속하세요.</p>
                    </div>
                    <div class="alert alert-danger" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
                    <div class="alert alert-info" th:if="${param.logout}">로그아웃되었습니다.</div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">아이디</label>
                            <input class="form-control" id="username" name="username" placeholder="아이디 입력" autofocus required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="password">비밀번호</label>
                            <input class="form-control" id="password" name="password" type="password" placeholder="비밀번호 입력" required>
                        </div>
                        <button class="btn btn-primary w-100 py-2" type="submit">로그인</button>
                    </form>
                    <div class="text-center mt-3 pt-3 border-top small text-muted">
                        아직 계정이 없으신가요? <a class="fw-semibold ms-1" th:href="@{/signup}">회원가입</a>
                        <div class="mt-2"><a class="text-decoration-none text-muted" th:href="@{/}">← 서비스 소개(홈)로 돌아가기</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>

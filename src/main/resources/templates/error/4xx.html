<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head><title>오류</title></head>
<body>
<main>
    <div class="row justify-content-center py-5">
        <div class="col-md-6 col-lg-5 text-center">
            <div class="card shadow-sm p-4">
                <div class="card-body">
                    <span class="badge text-bg-secondary mb-2">HTTP Error</span>
                    <h1 class="display-5 fw-bold mb-2" th:text="${status}">404</h1>
                    <p class="lead fs-6 mb-2" th:switch="${status}">
                        <span th:case="403">접근 권한이 없습니다.</span>
                        <span th:case="404">요청한 페이지를 찾을 수 없습니다.</span>
                        <span th:case="*">요청을 처리할 수 없습니다.</span>
                    </p>
                    <p class="text-muted small mb-4" th:if="${detail}" th:text="${detail}"></p>
                    <a class="btn btn-primary" th:href="@{/}">처음으로 돌아가기</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>

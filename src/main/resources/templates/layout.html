<!DOCTYPE html>
<!-- 모든 페이지 공통 레이아웃. 각 페이지는
     <html th:replace="~{layout :: layout(~{::title}, ~{::main})}"> 로 title 과 main 을 넘긴다. -->
<html lang="ko" th:fragment="layout(title, content)"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:replace="${title}">SubmitHub</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/highlightjs__cdn-assets/11.9.0/styles/github.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-md app-navbar mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            </span>
            <span>SubmitHub</span>
        </a>
        <div class="d-flex flex-wrap flex-grow-1 align-items-center">
            <ul class="navbar-nav flex-row gap-1 me-auto" sec:authorize="isAuthenticated()">
                <li class="nav-item"><a class="nav-link" th:href="@{/courses}">내 강의</a></li>
                <li class="nav-item" sec:authorize="hasRole('PROFESSOR')"><a class="nav-link" th:href="@{/courses/new}">강의 개설</a></li>
                <li class="nav-item" sec:authorize="hasRole('STUDENT')"><a class="nav-link" th:href="@{/courses/join}">수강 등록</a></li>
            </ul>
            <ul class="navbar-nav flex-row gap-2 ms-auto align-items-center">
                <li class="nav-item" sec:authorize="!isAuthenticated()"><a class="nav-link" th:href="@{/login}">로그인</a></li>
                <li class="nav-item" sec:authorize="!isAuthenticated()"><a class="btn btn-primary btn-sm" th:href="@{/signup}">회원가입</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="user-pill">
                        <span th:text="${#authentication.principal.name}">이름</span>
                        <span class="badge text-bg-secondary" sec:authorize="hasRole('PROFESSOR')">교수</span>
                        <span class="badge text-bg-info" sec:authorize="hasRole('STUDENT')">학생</span>
                    </span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button class="btn btn-outline-secondary btn-sm" type="submit">로그아웃</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container pb-5">
    <div class="alert alert-success mb-3" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger mb-3" th:if="${error}" th:text="${error}"></div>
    <th:block th:replace="${content}">내용</th:block>
</div>
<script th:src="@{/webjars/bootstrap/5.3.3/dist/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/highlightjs__cdn-assets/11.9.0/highlight.min.js}"></script>
<script th:src="@{/js/code-view.js}"></script>
</body>
</html>

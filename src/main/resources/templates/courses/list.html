<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>내 강의</title></head>
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">내 강의</h1>
            <p class="text-muted small mb-0">수강 중이거나 운영 중인 강의 목록입니다.</p>
        </div>
        <div>
            <a class="btn btn-primary" sec:authorize="hasRole('PROFESSOR')" th:href="@{/courses/new}">강의 개설</a>
            <a class="btn btn-primary" sec:authorize="hasRole('STUDENT')" th:href="@{/courses/join}">초대 코드로 수강 등록</a>
        </div>
    </div>

    <!-- 학생 전용 대시보드 위젯 (과제 브리핑 탭) -->
    <div sec:authorize="hasRole('STUDENT')" th:if="${(dueSoon != null and !#lists.isEmpty(dueSoon)) or (recent != null and !#lists.isEmpty(recent))}" class="card shadow-sm border-0 mb-4 bg-light bg-opacity-50">
        <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                <div class="d-flex align-items-center gap-2">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                    <strong class="text-dark">과제 현황 요약</strong>
                </div>
                <ul class="nav nav-pills nav-fill gap-1" id="briefingTab" role="tablist">
                    <li class="nav-item" role="presentation" th:if="${dueSoon != null and !#lists.isEmpty(dueSoon)}">
                        <button class="nav-link active py-1 px-3 small fw-semibold" id="due-tab" data-bs-toggle="pill" data-bs-target="#tab-due" type="button" role="tab">
                            <span class="status-dot bg-danger me-1"></span>마감 임박 <span class="badge text-bg-danger ms-1" th:text="${#lists.size(dueSoon)}">0</span>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation" th:if="${recent != null and !#lists.isEmpty(recent)}">
                        <button class="nav-link py-1 px-3 small fw-semibold" th:classappend="${dueSoon == null or #lists.isEmpty(dueSoon)} ? 'active' : ''"
                                id="recent-tab" data-bs-toggle="pill" data-bs-target="#tab-recent" type="button" role="tab">
                            <span class="status-dot bg-primary me-1"></span>최신 과제 <span class="badge text-bg-primary ms-1" th:text="${#lists.size(recent)}">0</span>
                        </button>
                    </li>
                </ul>
            </div>

            <div class="tab-content pt-1">
                <!-- 마감 임박 과제 탭 -->
                <div class="tab-pane fade show active" id="tab-due" role="tabpanel" th:if="${dueSoon != null and !#lists.isEmpty(dueSoon)}">
                    <div class="list-group list-group-flush bg-transparent">
                        <a th:each="a : ${dueSoon}" th:href="@{/assignments/{id}(id=${a.id})}"
                           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 px-3 rounded-2 mb-1 bg-white border">
                            <div class="me-2 text-truncate">
                                <span class="badge bg-secondary-subtle text-secondary border me-1" th:text="${a.courseName}">강의명</span>
                                <strong class="text-dark" th:text="${a.title}">과제 제목</strong>
                                <span class="text-danger small ms-2 fw-medium">
                                    <span th:text="${#temporals.format(a.dueAt, 'MM/dd HH:mm')}">마감일</span>
                                    <span th:if="${a.hoursLeft >= 0}" th:text="'(' + ${a.hoursLeft} + '시간 남음)'"></span>
                                </span>
                            </div>
                            <span class="btn btn-sm btn-danger text-nowrap py-1 px-2" style="font-size: 12.5px;" th:text="${a.myVersions > 0} ? '추가 제출 →' : '제출하기 →'">제출하기 →</span>
                        </a>
                    </div>
                </div>

                <!-- 최신 등록 과제 탭 -->
                <div class="tab-pane fade" th:classappend="${dueSoon == null or #lists.isEmpty(dueSoon)} ? 'show active' : ''"
                     id="tab-recent" role="tabpanel" th:if="${recent != null and !#lists.isEmpty(recent)}">
                    <div class="list-group list-group-flush bg-transparent">
                        <a th:each="a : ${recent}" th:href="@{/assignments/{id}(id=${a.id})}"
                           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 px-3 rounded-2 mb-1 bg-white border">
                            <div class="me-2 text-truncate">
                                <span class="badge bg-secondary-subtle text-secondary border me-1" th:text="${a.courseName}">강의명</span>
                                <strong class="text-dark" th:text="${a.title}">과제 제목</strong>
                                <span class="text-muted small ms-2">
                                    마감: <span th:text="${#temporals.format(a.dueAt, 'MM/dd HH:mm')}">마감일</span>
                                </span>
                            </div>
                            <div class="text-end text-nowrap">
                                <span th:if="${a.myVersions > 0}" class="badge text-bg-success">제출 완료 (v[[${a.myVersions}]])</span>
                                <span th:unless="${a.myVersions > 0}" class="badge bg-light text-secondary border">미제출</span>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="alert alert-secondary" th:if="${#lists.isEmpty(courses)}">
        <span sec:authorize="hasRole('PROFESSOR')">아직 개설한 강의가 없습니다. 강의를 개설하면 학생에게 줄 초대 코드가 발급됩니다.</span>
        <span sec:authorize="hasRole('STUDENT')">아직 수강 중인 강의가 없습니다. 교수에게 받은 초대 코드를 입력하세요.</span>
    </div>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="c : ${courses}">
            <a class="text-decoration-none text-reset d-block h-100" th:href="@{/courses/{id}(id=${c.id})}">
                <div class="card course-card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column justify-content-between p-4">
                        <div>
                            <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                                <span class="badge text-bg-secondary" th:text="${c.semester}">학기</span>
                            </div>
                            <h2 class="h5 card-title mb-2" th:text="${c.name}">강의명</h2>
                        </div>
                        <div class="pt-3 mt-2 border-top d-flex justify-content-between align-items-center small text-muted">
                            <span sec:authorize="hasRole('STUDENT')">담당 <strong class="text-dark fw-medium" th:text="${c.professorName}">교수</strong></span>
                            <span sec:authorize="hasRole('PROFESSOR')">수강생 <strong class="text-dark fw-medium" th:text="${c.studentCount}">0</strong>명</span>
                            <span class="text-primary fw-medium">열기 →</span>
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>
</main>
</body>
</html>

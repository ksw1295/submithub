<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head><title>로그인</title></head>
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3">로그인</h1>
                    <div class="alert alert-danger" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
                    <div class="alert alert-info" th:if="${param.logout}">로그아웃되었습니다.</div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">아이디</label>
                            <input class="form-control" id="username" name="username" autofocus required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">비밀번호</label>
                            <input class="form-control" id="password" name="password" type="password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">로그인</button>
                    </form>
                    <p class="text-center mt-3 mb-0"><a th:href="@{/signup}">회원가입</a></p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>

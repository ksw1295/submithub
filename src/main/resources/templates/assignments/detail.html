<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title th:text="${assignment.title}">과제</title></head>
<body>
<main>
    <nav aria-label="breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/courses}">내 강의</a></li>
        <li class="breadcrumb-item"><a th:href="@{/courses/{id}(id=${assignment.courseId})}" th:text="${assignment.courseName}">강의</a></li>
        <li class="breadcrumb-item active" th:text="${assignment.title}">과제</li></ol></nav>

    <div class="d-flex justify-content-between align-items-start mb-3">
        <h1 class="h3 mb-0" th:text="${assignment.title}">과제</h1>
        <div sec:authorize="hasRole('PROFESSOR')" class="d-flex gap-2">
            <a class="btn btn-outline-danger" th:href="@{/assignments/{id}/similarity(id=${assignment.id})}">표절 검사</a>
            <a class="btn btn-outline-secondary" th:href="@{/assignments/{id}/edit(id=${assignment.id})}">수정</a>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <p style="white-space: pre-wrap" th:text="${assignment.description}">설명</p>
            <dl class="row mb-0">
                <dt class="col-sm-3">마감</dt>
                <dd class="col-sm-9">
                    <span th:text="${#temporals.format(assignment.dueAt, 'yyyy-MM-dd HH:mm')}">마감</span>
                    <span class="badge text-bg-dark" th:if="${assignment.pastDue}">마감 지남</span>
                </dd>
                <dt class="col-sm-3">지각 제출</dt>
                <dd class="col-sm-9">
                    <span th:if="${!assignment.allowLate}">허용하지 않음</span>
                    <span th:if="${assignment.allowLate}">허용
                        <span th:if="${assignment.lateUntil != null}" th:text="'(' + ${#temporals.format(assignment.lateUntil, 'yyyy-MM-dd HH:mm')} + '까지)'"></span></span>
                </dd>
                <dt class="col-sm-3" sec:authorize="hasRole('PROFESSOR')">뼈대 코드</dt>
                <dd class="col-sm-9" sec:authorize="hasRole('PROFESSOR')" th:text="${assignment.hasBaseline} ? '등록됨 (표절 검사에서 제외)' : '없음'">없음</dd>
            </dl>
        </div>
    </div>

    <!-- 학생: 제출 -->
    <div sec:authorize="hasRole('STUDENT')">
        <div class="card shadow-sm mb-4">
            <div class="card-header"><strong>제출하기</strong></div>
            <div class="card-body">
                <div class="alert alert-secondary mb-0" th:if="${!assignment.open}">제출 기한이 지났습니다.</div>
                <form th:if="${assignment.open}" th:action="@{/assignments/{id}/submit(id=${assignment.id})}" method="post" enctype="multipart/form-data">
                    <div class="alert alert-warning" th:if="${assignment.pastDue}">마감 시간이 지났습니다. 지금 제출하면 <strong>지각 제출</strong>로 기록됩니다.</div>
                    <div class="mb-3">
                        <label class="form-label" for="files">파일 또는 zip (여러 개 선택 가능)</label>
                        <input class="form-control" type="file" id="files" name="files" multiple required>
                        <div class="form-text">제출할 때마다 새 버전이 쌓이고, 이전 버전은 그대로 보관됩니다.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="message">제출 메모 <small class="text-muted">(커밋 메시지처럼 이번 버전에서 무엇을 바꿨는지)</small></label>
                        <input class="form-control" id="message" name="message" maxlength="500" placeholder="예: 리뷰 반영해서 null 체크 추가">
                    </div>
                    <button class="btn btn-primary" type="submit">제출</button>
                </form>
            </div>
        </div>

        <th:block th:replace="~{submissions/fragments :: feedbackCard(${feedback}, true)}"></th:block>

        <div class="card shadow-sm mb-4">
            <div class="card-header"><strong>내 제출 이력</strong> <span class="text-muted" th:text="${#lists.size(history.versions)} + '개 버전'"></span></div>
            <div class="card-body" th:if="${#lists.isEmpty(history.versions)}"><span class="text-muted">아직 제출하지 않았습니다.</span></div>
            <th:block th:unless="${#lists.isEmpty(history.versions)}">
                <th:block th:replace="~{submissions/fragments :: timeline(${history})}"></th:block>
            </th:block>
        </div>
    </div>

    <!-- 교수: 제출 현황 -->
    <div sec:authorize="hasRole('PROFESSOR')">
        <div class="card shadow-sm mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong>제출 현황</strong>
                <span class="text-muted small" th:with="done=${#lists.size(status.?[submitted])}"
                      th:text="'제출 ' + ${done} + ' / 수강 ' + ${#lists.size(status)} + '명'"></span>
            </div>
            <div class="card-body" th:if="${#lists.isEmpty(status)}"><span class="text-muted">수강생이 없습니다.</span></div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(status)}">
                <table class="table table-hover mb-0">
                    <thead><tr><th>학생</th><th>학번</th><th>최신 버전</th><th>제출 시각</th><th>상태</th><th>점수</th><th>피드백 반영</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="s : ${status}">
                        <td th:text="${s.name}">이름</td>
                        <td th:text="${s.studentNo}">학번</td>
                        <td><span th:if="${s.submitted}" th:text="'v' + ${s.latestVersion} + ' (총 ' + ${s.versions} + '개)'"></span></td>
                        <td th:text="${s.submittedAt != null} ? ${#temporals.format(s.submittedAt, 'MM-dd HH:mm')} : ''"></td>
                        <td>
                            <span class="badge text-bg-secondary" th:unless="${s.submitted}">미제출</span>
                            <span class="badge text-bg-success" th:if="${s.submitted and !s.late}">제출</span>
                            <span class="badge text-bg-warning" th:if="${s.submitted and s.late}">지각</span>
                        </td>
                        <td><strong th:if="${s.score != null}" th:text="${s.score} + '점'"></strong></td>
                        <td th:with="fb=${feedbackByStudent.get(s.studentId)}">
                            <span th:if="${fb != null}">
                                <span th:if="${fb.hasRate}" th:text="${fb.ratePercent} + '%'" class="fw-bold"></span>
                                <small class="text-muted" th:text="'(미반영 ' + ${fb.unchanged} + ' / 전체 ' + ${fb.total} + ')'"></small>
                            </span>
                            <span th:if="${fb == null}" class="text-muted">-</span>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-primary" th:if="${s.submitted}"
                               th:href="@{/assignments/{a}/students/{s}(a=${assignment.id},s=${s.studentId})}">이력 보기</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>내 강의</title></head>
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">내 강의</h1>
            <p class="text-muted small mb-0">수강 중이거나 운영 중인 강의 목록입니다.</p>
        </div>
        <div>
            <a class="btn btn-primary" sec:authorize="hasRole('PROFESSOR')" th:href="@{/courses/new}">강의 개설</a>
            <a class="btn btn-primary" sec:authorize="hasRole('STUDENT')" th:href="@{/courses/join}">초대 코드로 수강 등록</a>
        </div>
    </div>

    <!-- 학생 전용 대시보드 위젯 (마감 임박 과제 & 최신 등록 과제) -->
    <div sec:authorize="hasRole('STUDENT')" th:if="${(dueSoon != null and !#lists.isEmpty(dueSoon)) or (recent != null and !#lists.isEmpty(recent))}" class="row g-3 mb-4">
        <!-- 마감 임박 과제 -->
        <div class="col-lg-6" th:if="${dueSoon != null and !#lists.isEmpty(dueSoon)}">
            <div class="card shadow-sm border-warning h-100">
                <div class="card-header bg-warning bg-opacity-10 border-warning d-flex justify-content-between align-items-center py-2">
                    <span class="fw-bold text-dark"><span class="badge text-bg-warning text-dark me-1">DUE</span> 🚨 마감 임박 과제</span>
                    <span class="badge text-bg-warning text-dark" th:text="${#lists.size(dueSoon)} + '건'">0건</span>
                </div>
                <div class="list-group list-group-flush">
                    <a th:each="a : ${dueSoon}" th:href="@{/assignments/{id}(id=${a.id})}"
                       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
                        <div class="me-2 text-truncate">
                            <span class="badge text-bg-secondary mb-1" th:text="${a.courseName}">강의명</span>
                            <div class="fw-semibold text-dark text-truncate" th:text="${a.title}">과제 제목</div>
                            <small class="text-danger">
                                마감: <span th:text="${#temporals.format(a.dueAt, 'yyyy-MM-dd HH:mm')}">마감일</span>
                                <span th:if="${a.hoursLeft >= 0}" th:text="'(' + ${a.hoursLeft} + '시간 남음)'"></span>
                            </small>
                        </div>
                        <span class="btn btn-sm btn-outline-danger text-nowrap">제출하기 &rarr;</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- 최신 등록 과제 -->
        <div class="col-lg-6" th:if="${recent != null and !#lists.isEmpty(recent)}" th:classappend="${dueSoon == null or #lists.isEmpty(dueSoon)} ? 'col-lg-12' : ''">
            <div class="card shadow-sm border-primary h-100">
                <div class="card-header bg-primary bg-opacity-10 border-primary d-flex justify-content-between align-items-center py-2">
                    <span class="fw-bold text-dark"><span class="badge text-bg-primary me-1">NEW</span> 📢 최신 등록 과제</span>
                    <span class="badge text-bg-primary" th:text="${#lists.size(recent)} + '건'">0건</span>
                </div>
                <div class="list-group list-group-flush">
                    <a th:each="a : ${recent}" th:href="@{/assignments/{id}(id=${a.id})}"
                       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
                        <div class="me-2 text-truncate">
                            <span class="badge text-bg-secondary mb-1" th:text="${a.courseName}">강의명</span>
                            <div class="fw-semibold text-dark text-truncate" th:text="${a.title}">과제 제목</div>
                            <small class="text-muted">
                                마감: <span th:text="${#temporals.format(a.dueAt, 'yyyy-MM-dd HH:mm')}">마감일</span>
                            </small>
                        </div>
                        <div class="text-end text-nowrap">
                            <span th:if="${a.myVersions > 0}" class="badge text-bg-success">제출 완료 (v[[${a.myVersions}]])</span>
                            <span th:unless="${a.myVersions > 0}" class="badge text-bg-outline-secondary border">미제출</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div class="alert alert-secondary" th:if="${#lists.isEmpty(courses)}">
        <span sec:authorize="hasRole('PROFESSOR')">아직 개설한 강의가 없습니다. 강의를 개설하면 학생에게 줄 초대 코드가 발급됩니다.</span>
        <span sec:authorize="hasRole('STUDENT')">아직 수강 중인 강의가 없습니다. 교수에게 받은 초대 코드를 입력하세요.</span>
    </div>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="c : ${courses}">
            <a class="text-decoration-none text-reset d-block h-100" th:href="@{/courses/{id}(id=${c.id})}">
                <div class="card course-card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column justify-content-between p-4">
                        <div>
                            <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                                <span class="badge text-bg-secondary" th:text="${c.semester}">학기</span>
                            </div>
                            <h2 class="h5 card-title mb-2" th:text="${c.name}">강의명</h2>
                        </div>
                        <div class="pt-3 mt-2 border-top d-flex justify-content-between align-items-center small text-muted">
                            <span sec:authorize="hasRole('STUDENT')">담당 <strong class="text-dark fw-medium" th:text="${c.professorName}">교수</strong></span>
                            <span sec:authorize="hasRole('PROFESSOR')">수강생 <strong class="text-dark fw-medium" th:text="${c.studentCount}">0</strong>명</span>
                            <span class="text-primary fw-medium">열기 →</span>
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>
</main>
</body>
</html>

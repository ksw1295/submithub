<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head><title>수강 등록</title></head>
<body>
<main>
    <div class="row justify-content-center auth-wrapper">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-1">초대 코드로 수강 등록</h1>
                    <p class="text-muted small mb-4">담당 교수님께 안내받은 8자리 초대 코드를 입력하세요.</p>
                    <form th:action="@{/courses/join}" th:object="${form}" method="post" novalidate>
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="inviteCode">초대 코드</label>
                            <input class="form-control text-uppercase code" style="letter-spacing: 0.08em; font-size: 15px;"
                                   th:errorclass="is-invalid" th:field="*{inviteCode}"
                                   placeholder="교수에게 받은 8자리 코드" autofocus autocomplete="off">
                            <div class="invalid-feedback" th:errors="*{inviteCode}"></div>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-primary" type="submit">등록하기</button>
                            <a class="btn btn-outline-secondary" th:href="@{/courses}">취소</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head><title th:text="${assignmentId == null} ? '과제 등록' : '과제 수정'">과제</title></head>
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-4" th:text="${assignmentId == null} ? '과제 등록' : '과제 수정'">과제</h1>
                    <form th:action="${assignmentId == null} ? @{/courses/{c}/assignments/new(c=${courseId})} : @{/assignments/{a}/edit(a=${assignmentId})}"
                          th:object="${form}" method="post" enctype="multipart/form-data" novalidate>
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="title">제목</label>
                            <input class="form-control" th:errorclass="is-invalid" th:field="*{title}">
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="description">설명</label>
                            <textarea class="form-control" rows="4" th:errorclass="is-invalid" th:field="*{description}"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="dueAt">마감 일시</label>
                                <input class="form-control" type="datetime-local" th:errorclass="is-invalid" th:field="*{dueAt}">
                                <div class="invalid-feedback" th:errors="*{dueAt}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="lateUntil">지각 허용 기한 <small class="text-muted fw-normal">(비우면 기한 없음)</small></label>
                                <input class="form-control" type="datetime-local" th:field="*{lateUntil}">
                            </div>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" th:field="*{allowLate}">
                            <label class="form-check-label" for="allowLate1">마감 후 지각 제출 허용 (지각으로 표시됨)</label>
                        </div>
                        <hr class="my-4">
                        <h2 class="h6 mb-2">조별(팀) 과제 설정</h2>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" th:field="*{teamProject}" id="teamProjectCheck">
                            <label class="form-check-label fw-semibold" for="teamProjectCheck">
                                조별(팀) 과제로 운영
                            </label>
                            <div class="form-text">체크 시 학생들이 조를 만들고 공용 GitHub 저장소 및 개인 개발 브랜치를 매핑하여 '기여도 감사'를 수행할 수 있습니다.</div>
                        </div>
                        <div class="mb-3" id="teamSizeGroup" th:classappend="${form.teamProject} ? '' : 'd-none'">
                            <label class="form-label" for="maxTeamSize">최대 팀 인원 수 <small class="text-muted fw-normal">(선택, 비우면 인원 제한 없음)</small></label>
                            <input class="form-control" type="number" min="2" max="20" th:errorclass="is-invalid" th:field="*{maxTeamSize}" placeholder="예: 4 (최소 2명 이상)">
                            <div class="invalid-feedback" th:errors="*{maxTeamSize}"></div>
                        </div>
                        <script>
                            document.addEventListener('DOMContentLoaded', function() {
                                var chk = document.getElementById('teamProjectCheck');
                                var grp = document.getElementById('teamSizeGroup');
                                if (chk && grp) {
                                    chk.addEventListener('change', function() {
                                        if (this.checked) {
                                            grp.classList.remove('d-none');
                                        } else {
                                            grp.classList.add('d-none');
                                        }
                                    });
                                }
                            });
                        </script>
                        <hr class="my-4">
                        <h2 class="h6 mb-2">뼈대 코드 <small class="text-muted fw-normal">(선택) — 교수가 나눠준 코드. 표절 검사에서 이 부분은 제외됩니다.</small></h2>
                        <p class="small text-success" th:if="${hasBaseline}">현재 뼈대 코드가 등록되어 있습니다. 새로 입력하면 교체되고, 비워 두면 유지됩니다.</p>
                        <div class="mb-3">
                            <textarea class="form-control code" rows="6" th:field="*{baselineCode}" placeholder="뼈대 코드를 붙여넣거나 아래에서 파일을 올리세요"></textarea>
                        </div>
                        <div class="mb-4">
                            <input class="form-control" type="file" name="baselineFile">
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-primary" type="submit">저장</button>
                            <a class="btn btn-outline-secondary" th:href="${assignmentId == null} ? @{/courses/{c}(c=${courseId})} : @{/assignments/{a}(a=${assignmentId})}">취소</a>
                        </div>
                    </form>
                    <form th:if="${hasBaseline}" th:action="@{/assignments/{a}/baseline/delete(a=${assignmentId})}" method="post" class="mt-3 pt-3 border-top">
                        <button class="btn btn-sm btn-outline-danger" type="submit">등록된 뼈대 코드 삭제</button>
                    </form>
                    <div th:if="${assignmentId != null}" class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
                        <div class="small text-muted">
                            <span th:if="${canDelete}">학생 제출물이 없는 과제는 삭제할 수 있습니다.</span>
                            <span th:unless="${canDelete}" class="text-danger">학생 제출물이 존재하여 삭제할 수 없습니다. (마감일 수정 권장)</span>
                        </div>
                        <form th:if="${canDelete}" th:action="@{/assignments/{a}/delete(a=${assignmentId})}" method="post"
                              onsubmit="return confirm('학생 제출물이 없는 과제입니다. 정말로 이 과제를 삭제하시겠습니까?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">과제 삭제</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>

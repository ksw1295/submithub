<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title th:text="${assignment.title} + ' - 팀 관리'">조별 과제 팀 관리</title></head>
<body>
<main>
    <nav aria-label="breadcrumb"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/courses}">내 강의</a></li>
        <li class="breadcrumb-item"><a th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.name}">강의</a></li>
        <li class="breadcrumb-item"><a th:href="@{/assignments/{id}(id=${assignment.id})}" th:text="${assignment.title}">과제</a></li>
        <li class="breadcrumb-item active">조별 과제 / 팀 관리</li>
    </ol></nav>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
            <h1 class="h3 mb-1">조별 과제 / 팀 관리</h1>
            <p class="text-muted mb-0" th:text="${assignment.title} + ' 에 등록된 팀 및 브랜치 현황입니다.'"></p>
        </div>
        <div>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/assignments/{id}(id=${assignment.id})}">&larr; 과제로 돌아가기</a>
        </div>
    </div>

    <!-- 알림 메시지 -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- 학생: 내 팀 정보 카드 -->
    <div sec:authorize="hasRole('STUDENT')" th:if="${myTeam != null}" class="card shadow-sm border-primary mb-4">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <strong>내 팀: <span th:text="${myTeam.name}">우리팀</span></strong>
            <span class="badge bg-light text-primary">팀원 <span th:text="${myTeam.members.size()}">3</span>명</span>
        </div>
        <div class="card-body">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <p class="mb-2"><strong>팀 저장소:</strong> 
                        <a th:if="${myTeam.repoUrl != null and !myTeam.repoUrl.isBlank()}" th:href="${myTeam.repoUrl.startsWith('http') ? myTeam.repoUrl : 'https://github.com/' + myTeam.repoUrl}" target="_blank" th:text="${myTeam.repoUrl}">repo</a>
                        <span th:if="${myTeam.repoUrl == null or myTeam.repoUrl.isBlank()}" class="text-muted">미설정</span>
                    </p>
                    <div class="d-flex flex-wrap gap-2">
                        <span th:each="m : ${myTeam.members}" class="badge bg-light text-dark border p-2">
                            <span th:text="${m.student.name}">홍길동</span>
                            <span class="text-muted" th:text="'(' + ${m.roleTitle} + ')'"></span>:
                            <code th:text="${m.branchName}">feature/rag</code>
                        </span>
                    </div>
                </div>
                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <a class="btn btn-primary" th:href="@{/teams/{id}/audit(id=${myTeam.id})}">
                        우리 팀 기여도 감사 대시보드 &rarr;
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- 학생: 아직 팀이 없는 경우 팀 생성 카드 -->
    <div sec:authorize="hasRole('STUDENT')" th:if="${myTeam == null}" class="card shadow-sm mb-4">
        <div class="card-header"><strong>새 팀 생성하기</strong></div>
        <div class="card-body">
            <form th:action="@{/assignments/{id}/teams(id=${assignment.id})}" method="post" th:object="${createTeamForm}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="name">팀명 <span class="text-danger">*</span></label>
                        <input class="form-control" type="text" id="name" th:field="*{name}" placeholder="예: 1조 - RAG 챗봇팀" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="repoUrl">GitHub 저장소 (선택)</label>
                        <input class="form-control" type="text" id="repoUrl" th:field="*{repoUrl}" placeholder="예: owner/repo 또는 URL">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="branchName">내 담당 브랜치</label>
                        <input class="form-control" type="text" id="branchName" th:field="*{branchName}" placeholder="main 또는 feature/...">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="roleTitle">담당 역할</label>
                        <input class="form-control" type="text" id="roleTitle" th:field="*{roleTitle}" placeholder="팀장 / AI 엔진">
                    </div>
                </div>
                <div class="mt-3 text-end">
                    <button class="btn btn-primary btn-sm" type="submit">팀 생성하고 팀장으로 등록</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 전체 등록 팀 목록 -->
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <strong>과제 참여 팀 목록 (<span th:text="${teams.size()}">0</span>개 팀)</strong>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>팀명</th>
                    <th>팀장</th>
                    <th>팀원 수</th>
                    <th>팀 저장소</th>
                    <th>팀원 및 담당 브랜치</th>
                    <th class="text-end">기여도 감사</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${teams.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4">아직 등록된 팀이 없습니다.</td>
                </tr>
                <tr th:each="t : ${teams}">
                    <td>
                        <strong th:text="${t.name}">1조</strong>
                    </td>
                    <td>
                        <span th:text="${t.leader.name}">이민준</span>
                    </td>
                    <td>
                        <span class="badge text-bg-secondary" th:text="${t.members.size()} + '명'">3명</span>
                    </td>
                    <td>
                        <a th:if="${t.repoUrl != null and !t.repoUrl.isBlank()}" th:href="${t.repoUrl.startsWith('http') ? t.repoUrl : 'https://github.com/' + t.repoUrl}" target="_blank" th:text="${t.repoUrl}">repo</a>
                        <span th:if="${t.repoUrl == null or t.repoUrl.isBlank()}" class="text-muted">-</span>
                    </td>
                    <td>
                        <div class="d-flex flex-wrap gap-1">
                            <span th:each="m : ${t.members}" class="badge bg-light text-dark border">
                                <span th:text="${m.student.name}">학생</span>: <code th:text="${m.branchName}">branch</code>
                            </span>
                        </div>
                    </td>
                    <td class="text-end">
                        <div class="d-flex justify-content-end gap-1">
                            <!-- 학생이 팀이 없고 정원 미달인 경우 참여 버튼 -->
                            <form sec:authorize="hasRole('STUDENT')" th:if="${myTeam == null and (assignment.maxTeamSize == null or t.members.size() < assignment.maxTeamSize)}" th:action="@{/teams/{id}/join(id=${t.id})}" method="post" class="d-inline">
                                <button class="btn btn-outline-success btn-sm" type="submit">팀 참여</button>
                            </form>
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/teams/{id}/audit(id=${t.id})}">
                                기여도 감사 &rarr;
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>

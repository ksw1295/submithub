# MariaDB 프로필. DB 접속 정보는 환경변수로 넘긴다 (docker-compose.yml 이 설정해 준다).
spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/submithub}
    username: ${DB_USER:submithub}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
  thymeleaf:
    cache: true

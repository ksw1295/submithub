# 시연 PC 및 Azure 배포용 Docker Compose
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: submithub
      MARIADB_USER: ${DB_USER:?.env 에 DB_USER 를 설정하세요}
      MARIADB_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?.env 에 DB_ROOT_PASSWORD 를 설정하세요}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ============================================================================
  # Docker Socket Proxy: 최소 권한 보안 격리 프록시 (Least-Privilege Security Proxy)
  # ----------------------------------------------------------------------------
  # 앱 컨테이너(app)에 호스트의 /var/run/docker.sock 을 직접 바인드 마운트할 경우,
  # 악의적인 사용자/제출 코드가 Docker 데몬을 통해 호스트 루트 권한을 탈취(Container Escape)
  # 할 수 있는 심각한 보안 취약점이 발생합니다.
  # 이를 방지하기 위해 tecnativa/docker-socket-proxy 를 사이에 두고:
  # 1. 호스트 소켓은 socket-proxy 에 읽기 전용(:ro)으로만 마운트
  # 2. 채점에 필수적인 컨테이너 생성/실행 API만 허용 (CONTAINERS=1, POST=1)
  # 3. 호스트 파일시스템 탈취(VOLUMES=0), 이미지 임의 빌드(BUILD=0), 네트워크 조작(NETWORKS=0),
  #    비밀정보 조회(SECRETS=0), 컨테이너 내부 침투(EXEC=0) 등 위험한 API 일체 차단
  # ============================================================================
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # [허용 엔드포인트] 채점 컨테이너 라이프사이클 제어 (create, start, wait, remove, logs)
      - CONTAINERS=1
      - POST=1
      - INFO=1
      - VERSION=1
      - PING=1
      # [차단 엔드포인트] 호스트 침투 및 관리자 권한 악용 원천 차단
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
      - SECRETS=0

  grading-init:
    image: alpine:3
    environment:
      GRADING_WORK_DIR: /srv/submithub/grading-work
    command: ["sh", "-c", "mkdir -p \"$$GRADING_WORK_DIR\" && chmod 1777 \"$$GRADING_WORK_DIR\""]
    volumes:
      - /srv/submithub/grading-work:/srv/submithub/grading-work

  app:
    build: .
    image: submithub-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      socket-proxy:
        condition: service_started
      grading-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      DB_URL: jdbc:mariadb://db:3306/submithub
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SUBMITHUB_STORAGE_DIR: /app/uploads
      SUBMITHUB_DEMO_DATA: ${DEMO_DATA:-true}
      SUBMITHUB_PROFESSOR_SIGNUP_CODE: ${PROFESSOR_SIGNUP_CODE:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DOCKER_HOST: tcp://socket-proxy:2375
      GRADING_WORK_DIR: /srv/submithub/grading-work
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
      - /srv/submithub/grading-work:/srv/submithub/grading-work
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db-data:
  uploads:

<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head><title>오류</title></head>
<body>
<main>
    <div class="text-center py-5">
        <h1 class="display-4" th:text="${status}">404</h1>
        <p class="lead" th:switch="${status}">
            <span th:case="403">접근 권한이 없습니다.</span>
            <span th:case="404">요청한 페이지를 찾을 수 없습니다.</span>
            <span th:case="*">요청을 처리할 수 없습니다.</span>
        </p>
        <p class="text-muted" th:if="${detail}" th:text="${detail}"></p>
        <a class="btn btn-primary" th:href="@{/}">처음으로</a>
    </div>
</main>
</body>
</html>

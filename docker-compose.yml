# 시연 PC 에서 한 줄로 실행:
#   cp .env.example .env   (처음 한 번, 비밀번호는 원하는 값으로 바꿔도 된다)
#   docker compose up --build
# 접속: http://localhost:8080
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: submithub
      MARIADB_USER: ${DB_USER:?.env 에 DB_USER 를 설정하세요}
      MARIADB_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?.env 에 DB_ROOT_PASSWORD 를 설정하세요}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      DB_URL: jdbc:mariadb://db:3306/submithub
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SUBMITHUB_STORAGE_DIR: /app/uploads
      # true 이면 DB 가 비어 있을 때 시연용 샘플 데이터를 넣는다 (실제 운영에서는 false)
      SUBMITHUB_DEMO_DATA: ${DEMO_DATA:-true}
      SUBMITHUB_PROFESSOR_SIGNUP_CODE: ${PROFESSOR_SIGNUP_CODE:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  db-data:
  uploads:
